name: Bug
description: Something does not work
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes: {label: What happened, description: "Command you ran, what you expected, what you got"}
    validations: {required: true}
  - type: textarea
    id: doctor
    attributes: {label: "Output of cu-local doctor", render: text}
  - type: input
    id: versions
    attributes: {label: Versions, placeholder: "cu-local 1.0.0, ChatGPT.app 26.x, macOS 27.x"}
