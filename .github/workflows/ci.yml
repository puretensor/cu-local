name: ci
on:
  push:
  pull_request:

jobs:
  test-macos-system-python:
    # The real target: the python3 that ships with macOS (3.9).
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: /usr/bin/python3 --version
      - run: /usr/bin/python3 -m unittest discover -s tests -v
      - run: /usr/bin/python3 cu_local.py --version

  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck install.sh scripts/leak-scan.sh
      - run: sh scripts/leak-scan.sh
